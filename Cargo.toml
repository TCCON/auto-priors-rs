[workspace]
members = ["core-orm", "cli", "service", "web-app"]
exclude = ["deps/Rocket", "python-bindings"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.72"
axum-login = "0.18.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "3.2", features = ["derive", "cargo"] }
djangohashers = "1.7.3"
dotenv = "0.15.0"
env_logger = "0.11"
glob = "0.3"
itertools = "0.10.3"
jsonwebtoken = "9.3.1"
lettre = { version = "0.10", default-features = false, features = [
    "base64",
    "builder",
    "email-encoding",
    "fastrand",
    "hostname",
    "httpdate",
    "mime",
    "nom",
    "once_cell",
    "pool",
    "quoted_printable",
    "serde",
    "smtp-transport",
    "socket2",
    "rustls-tls",
] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "charset",
    "h2",
    "hickory-dns",
    "http2",
    "json",
    "stream",
    "system-proxy",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = [
    "mysql",
    "runtime-tokio-rustls",
    "chrono",
] }
strum = { version = "0.27", features = ["derive"] }
tabled = "0.14.0"
tempdir = "0.3"
testcontainers-modules = { version = "0.15", features = [
    "mariadb",
    "blocking",
] }
test-log = "0.2.16"
thiserror = "1.0.61"
tokio = { version = "1.41.0", features = ["full"] }
url = { version = "2.2", features = ["serde"] }
utoipa = "5.4.0"
# tokio = {version = "1.31.0", features = ["full", "tracing"]}
